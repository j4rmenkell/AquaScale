name: React CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'AquaScale.BackOffice/**'
      - 'AquaScale.FieldWorker/**'
      - 'AquaScale.Portal/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'AquaScale.BackOffice/**'
      - 'AquaScale.FieldWorker/**'
      - 'AquaScale.Portal/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x]
        project: 
          - AquaScale.BackOffice
          - AquaScale.FieldWorker
          - AquaScale.Portal

    # This forces all 'run' commands in this job to execute inside the specific project folder
    defaults:
      run:
        working-directory: ./${{ matrix.project }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          # Dynamically targets the correct lock file for each project
          cache-dependency-path: './${{ matrix.project }}/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint --if-present

      - name: Run tests
        run: npm run test -- --passWithNoTests

      - name: Build application
        run: npm run build
        env:
          CI: true

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          # Creates a uniquely named artifact for each project (e.g., AquaScale.Portal-build-node-22.x)
          name: ${{ matrix.project }}-build-node-${{ matrix.node-version }}
          path: |
            ./${{ matrix.project }}/dist/
            ./${{ matrix.project }}/build/
            ./${{ matrix.project }}/.next/
          retention-days: 7
